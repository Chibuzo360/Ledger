spring:
  application:
    name: ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD} # no default: startup fails loudly if missing
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false} # set SHOW_SQL=true locally when debugging

server:
  port: ${PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET} # no default, same reason
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO} # set DEBUG locally when debugging